[project]
name = "abarrotes-backend"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/W: PEP 8 · F: errores · I: orden de imports (isort) · UP: sintaxis moderna
# B: bugs comunes · S: seguridad (bandit) · D: docstrings · ANN: type hints
select = ["E", "W", "F", "I", "UP", "B", "S", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# En pruebas se permite assert y no se exigen docstrings ni anotaciones;
# conftest define variables de entorno antes de importar la app (E402)
"tests/**" = ["S101", "D", "ANN", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
