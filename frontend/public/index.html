<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Dashboard Offline</title>

    <!-- Bootstrap local -->
    <link rel="stylesheet" href="static/css/bootstrap.css">

    <link rel="stylesheet" href="static/css/pos.css">

    <!-- FontAwesome local -->
    <link rel="stylesheet" href="static/fontawesome/css/all.min.css">

</head>

<body>

    <div id="sidebar">
        <div class="menu-item" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
            <span class="menu-text">Menú</span>
        </div>

        <div class="menu-item"><i class="fa-solid fa-cash-register"></i><span class="menu-text">Vender</span></div>
        <div class="menu-item"><i class="fa-solid fa-house"></i><span class="menu-text">Inicio</span></div>
        <div class="menu-item" onclick="location.href='productos.html'"><i class="fa-solid fa-box"></i><span class="menu-text">Productos</span></div>
        <div class="menu-item"><i class="fa-solid fa-users"></i><span class="menu-text">Clientes</span></div>
        <div class="menu-item"><i class="fa-solid fa-gear"></i><span class="menu-text">Configuración</span></div>
    </div>

    <div id="main" class="container-fluid">

        <div class="row mt-4">

            <div class="col-md-3">
                <div id="cart-area">
                    <h4 class="mb-3"><i class="fa-solid fa-cart-shopping"></i> Venta</h4>
                    <p class="text-secondary">Carrito vacío</p>
                </div>
            </div>
        

            <div class="col-md-8">
                <table class="product-table" id="productTable">
                    <tbody></tbody>
                </table>
            </div>
            <script src="static/js/products.js"></script>
        </div>

    </div>

    <script src="static/js/bootstrap.bundle.min.js"></script>

    <script>
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("collapsed");
        }
    </script>

</body>
</html>
