```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abarrotes POS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
            background: #f4f6f8;
            color: #263238;
        }

        main {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000015;
        }

        button {
            padding: 10px 18px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #resultado {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main>
        <h1>Abarrotes POS</h1>
        <p>Sistema de punto de venta para tu tienda.</p>

        <button id="btnBackend">Verificar conexión con el backend</button>

        <p id="resultado">Frontend iniciado. Esperando prueba...</p>
    </main>

    <script>
        document.getElementById("btnBackend").addEventListener("click", async () => {
            const resultado = document.getElementById("resultado");
            resultado.textContent = "Conectando con el backend...";

            try {
                const respuesta = await fetch("/api/health");

                if (!respuesta.ok) {
                    throw new Error(`HTTP ${respuesta.status}`);
                }

                const datos = await respuesta.json();
                resultado.textContent =
                    `Backend conectado correctamente: ${datos.status}`;
            } catch (error) {
                resultado.textContent =
                    `Error de conexión: ${error.message}`;
            }
        });
    </script>
</body>
</html>
