server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Encabezados de seguridad básicos (OWASP)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Límite de cuerpo de petición: la API solo recibe JSON pequeño
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # El navegador revalida siempre (ETag → 304 si no cambió): tras
        # reconstruir el frontend se ven al instante los JS, CSS e imágenes nuevos.
        # "expires" no anula los add_header de seguridad del bloque server.
        expires -1;
    }
}
